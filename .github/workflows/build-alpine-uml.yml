name: Build Alpine Linux disk.img for UML (Minecraft)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      disk_size_gb:
        description: 'Kich thuoc disk (GB), mac dinh 9'
        required: false
        default: '9'
      alpine_version:
        description: 'Phien ban Alpine (mac dinh 3.20, can 3.20+ de co fastfetch)'
        required: false
        default: '3.20'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cai cong cu build
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y e2fsprogs util-linux wget curl zip

      - name: Thiet lap bien
        id: cfg
        run: |
          DISK_GB="${{ github.event.inputs.disk_size_gb || '9' }}"
          ALPINE_VER="${{ github.event.inputs.alpine_version || '3.20' }}"
          ARCH="x86_64"
          echo "DISK_GB=$DISK_GB"       >> "$GITHUB_OUTPUT"
          echo "ALPINE_VER=$ALPINE_VER" >> "$GITHUB_OUTPUT"
          echo "ARCH=$ARCH"             >> "$GITHUB_OUTPUT"
          echo "=== Alpine $ALPINE_VER | ${DISK_GB}GB ==="

      - name: Tao va format base.img (ext4)
        run: |
          DISK_GB="${{ steps.cfg.outputs.DISK_GB }}"
          dd if=/dev/null of=base.img bs=1M seek=$(( DISK_GB * 1024 ))
          mkfs.ext4 -F -L alpine-uml base.img
          echo ">>> ext4 ${DISK_GB}GB OK"

      - name: Download Alpine minirootfs
        run: |
          ALPINE_VER="${{ steps.cfg.outputs.ALPINE_VER }}"
          ARCH="${{ steps.cfg.outputs.ARCH }}"
          MINOR=$(echo "$ALPINE_VER" | cut -d. -f1-2)
          TARBALL="alpine-minirootfs-${ALPINE_VER}.0-${ARCH}.tar.gz"
          URL="https://dl-cdn.alpinelinux.org/alpine/v${MINOR}/releases/${ARCH}/${TARBALL}"
          echo ">>> Download: $URL"
          wget -q --show-progress -O alpine-minirootfs.tar.gz "$URL"

      - name: Populate rootfs vao base.img
        run: |
          ALPINE_VER="${{ steps.cfg.outputs.ALPINE_VER }}"
          MINOR=$(echo "$ALPINE_VER" | cut -d. -f1-2)

          mkdir -p /tmp/alpine-root
          sudo mount -o loop base.img /tmp/alpine-root
          sudo tar -xzf alpine-minirootfs.tar.gz -C /tmp/alpine-root

          # --- DNS ---
          sudo tee /tmp/alpine-root/etc/resolv.conf > /dev/null <<'EOF'
nameserver 10.0.2.3
nameserver 8.8.8.8
EOF

          # --- APK repos (khong chay apk update o day, de chroot tu lam) ---
          sudo tee /tmp/alpine-root/etc/apk/repositories > /dev/null <<EOF
https://dl-cdn.alpinelinux.org/alpine/v${MINOR}/main
https://dl-cdn.alpinelinux.org/alpine/v${MINOR}/community
EOF

          # --- fstab ---
          sudo tee /tmp/alpine-root/etc/fstab > /dev/null <<'EOF'
          /dev/ubda  /        ext4  defaults  0 1
          proc       /proc    proc  defaults  0 0
          sysfs      /sys     sysfs defaults  0 0
          tmpfs      /tmp     tmpfs defaults  0 0
          EOF

          # --- hostname ---
          echo "alpine-uml" | sudo tee /tmp/alpine-root/etc/hostname > /dev/null

          # --- Network: static IP cho SLIRP ---
          sudo tee /tmp/alpine-root/etc/network/interfaces > /dev/null <<'EOF'
          auto lo
          iface lo inet loopback

          auto eth0
          iface eth0 inet static
            address 10.0.2.15
            netmask 255.255.255.0
            gateway 10.0.2.2
          EOF

          # --- inittab: UML dung /dev/console ---
          sudo tee /tmp/alpine-root/etc/inittab > /dev/null <<'EOF'
          ::sysinit:/sbin/openrc sysinit
          ::sysinit:/sbin/openrc boot
          ::wait:/sbin/openrc default
          console::respawn:/sbin/getty -L console 115200 vt100
          tty1::respawn:/sbin/getty -L tty1 115200 vt100
          ::ctrlaltdel:/sbin/reboot
          ::shutdown:/sbin/openrc shutdown
          EOF

          # --- Cai package (chay BEN TRONG Alpine image) ---
          echo ">>> apk update + upgrade + add packages..."
          sudo chroot /tmp/alpine-root /bin/sh -c "
            apk update
            apk upgrade --no-cache
            apk add --no-cache \
              openjdk21-jre-headless \
              openssh openrc bash \
              curl wget ca-certificates \
              tzdata screen \
              fastfetch
          "

          # --- SSH config ---
          sudo chroot /tmp/alpine-root /bin/sh -c "
            sed -i 's/#PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config
            sed -i 's/#PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
            ssh-keygen -A
            echo 'root:toor' | chpasswd
          "

          # --- Enable services ---
          sudo chroot /tmp/alpine-root /bin/sh -c "
            rc-update add sshd default
            rc-update add networking boot
            rc-update add hostname boot
          "

          # --- Minecraft ---
          sudo mkdir -p /tmp/alpine-root/opt/minecraft

          [ -f server.jar ] && sudo cp server.jar /tmp/alpine-root/opt/minecraft/ \
            && echo ">>> server.jar da copy" \
            || echo "CANH BAO: chua co server.jar, can upload sau"

          sudo tee /tmp/alpine-root/opt/minecraft/server.properties > /dev/null <<'EOF'
          server-ip=0.0.0.0
          server-port=25565
          query.port=25565
          max-tick-time=60000
          player-idle-timeout=10
          view-distance=10
          simulation-distance=5
          accepts-transfers=true
          EOF

          echo "eula=true" | sudo tee /tmp/alpine-root/opt/minecraft/eula.txt > /dev/null

          sudo tee /tmp/alpine-root/opt/minecraft/start.sh > /dev/null <<'MCEOF'
          #!/bin/bash
          cd /opt/minecraft
          exec java \
            -Xms512M -Xmx1800M \
            -XX:+UseG1GC \
            -XX:+ParallelRefProcEnabled \
            -XX:MaxGCPauseMillis=200 \
            -XX:+UnlockExperimentalVMOptions \
            -XX:+DisableExplicitGC \
            -jar server.jar nogui
          MCEOF
          sudo chmod +x /tmp/alpine-root/opt/minecraft/start.sh

          # --- OpenRC service cho Minecraft ---
          sudo tee /tmp/alpine-root/etc/init.d/minecraft > /dev/null <<'EOF'
          #!/sbin/openrc-run
          name="minecraft"
          description="Minecraft Java Server"
          command="/opt/minecraft/start.sh"
          command_background=true
          pidfile="/run/minecraft.pid"
          output_log="/var/log/minecraft.log"
          error_log="/var/log/minecraft.log"
          depend() {
            after networking sshd
          }
          EOF
          sudo chmod +x /tmp/alpine-root/etc/init.d/minecraft

          sudo chroot /tmp/alpine-root /bin/sh -c "rc-update add minecraft default"

          echo "=== Disk usage ==="
          df -h /tmp/alpine-root

      - name: Unmount
        run: sudo umount /tmp/alpine-root

      - name: Nen base.img -> base.zip
        run: |
          zip -9 base.zip base.img
          du -sh base.img base.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: alpine-uml-disk-${{ steps.cfg.outputs.DISK_GB }}gb
          path: base.zip
          retention-days: 30

      - name: Huong dan
        run: |
          echo "==========================================="
          echo "  SAU KHI DOWNLOAD artifact:"
          echo "  1. Giai nen ra base.zip"
          echo "  2. Upload base.zip -> /home/container/"
          echo "  3. run.sh tu dong giai nen + boot UML"
          echo ""
          echo "  slirp.yaml ports can them:"
          echo "    - 28103:25565  # Minecraft Java"
          echo "    - 28102:22     # SSH"
          echo ""
          echo "  ssh root@<ip> -p 28102  (pass: toor)"
          echo "  Minecraft: <ip>:28103"
          echo "==========================================="
