name: Build Alpine Linux disk.img for UML (Minecraft)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      disk_size_gb:
        description: 'Kich thuoc disk (GB), mac dinh 9'
        required: false
        default: '9'
      alpine_version:
        description: 'Phien ban Alpine (can 3.20+ de co fastfetch)'
        required: false
        default: '3.20'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cai cong cu build
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y e2fsprogs util-linux wget curl zip

      - name: Thiet lap bien
        id: cfg
        run: |
          DISK_GB="${{ github.event.inputs.disk_size_gb || '9' }}"
          ALPINE_VER="${{ github.event.inputs.alpine_version || '3.20' }}"
          echo "DISK_GB=$DISK_GB"       >> "$GITHUB_OUTPUT"
          echo "ALPINE_VER=$ALPINE_VER" >> "$GITHUB_OUTPUT"
          echo "ARCH=x86_64"            >> "$GITHUB_OUTPUT"
          echo "=== Alpine $ALPINE_VER | ${DISK_GB}GB ==="

      - name: Tao va format base.img
        run: |
          DISK_GB="${{ steps.cfg.outputs.DISK_GB }}"
          dd if=/dev/null of=base.img bs=1M seek=$(( DISK_GB * 1024 ))
          mkfs.ext4 -F -L alpine-uml base.img
          echo ">>> ext4 ${DISK_GB}GB OK"

      - name: Download Alpine minirootfs
        run: |
          ALPINE_VER="${{ steps.cfg.outputs.ALPINE_VER }}"
          ARCH="${{ steps.cfg.outputs.ARCH }}"
          MINOR=$(echo "$ALPINE_VER" | cut -d. -f1-2)
          TARBALL="alpine-minirootfs-${ALPINE_VER}.0-${ARCH}.tar.gz"
          URL="https://dl-cdn.alpinelinux.org/alpine/v${MINOR}/releases/${ARCH}/${TARBALL}"
          echo ">>> Download: $URL"
          wget -q --show-progress -O alpine-minirootfs.tar.gz "$URL"

      - name: Populate rootfs vao base.img
        run: |
          ALPINE_VER="${{ steps.cfg.outputs.ALPINE_VER }}"
          MINOR=$(echo "$ALPINE_VER" | cut -d. -f1-2)

          mkdir -p /tmp/r
          sudo mount -o loop base.img /tmp/r
          sudo tar -xzf alpine-minirootfs.tar.gz -C /tmp/r

          # DNS
          printf 'nameserver 10.0.2.3\nnameserver 8.8.8.8\n' | sudo tee /tmp/r/etc/resolv.conf > /dev/null

          # APK repos
          printf "https://dl-cdn.alpinelinux.org/alpine/v%s/main\nhttps://dl-cdn.alpinelinux.org/alpine/v%s/community\n" "$MINOR" "$MINOR" \
            | sudo tee /tmp/r/etc/apk/repositories > /dev/null

          # fstab
          printf '/dev/ubda  /     ext4  defaults  0 1\nproc  /proc  proc  defaults  0 0\nsysfs /sys  sysfs defaults  0 0\ntmpfs /tmp  tmpfs defaults  0 0\n' \
            | sudo tee /tmp/r/etc/fstab > /dev/null

          # hostname
          printf 'alpine-uml\n' | sudo tee /tmp/r/etc/hostname > /dev/null

          # network (SLIRP static)
          printf 'auto lo\niface lo inet loopback\n\nauto eth0\niface eth0 inet static\n  address 10.0.2.15\n  netmask 255.255.255.0\n  gateway 10.0.2.2\n' \
            | sudo tee /tmp/r/etc/network/interfaces > /dev/null

          # inittab (UML dung /dev/console)
          printf '::sysinit:/sbin/openrc sysinit\n::sysinit:/sbin/openrc boot\n::wait:/sbin/openrc default\nconsole::respawn:/sbin/getty -L console 115200 vt100\ntty1::respawn:/sbin/getty -L tty1 115200 vt100\n::ctrlaltdel:/sbin/reboot\n::shutdown:/sbin/openrc shutdown\n' \
            | sudo tee /tmp/r/etc/inittab > /dev/null

          # Cai package BEN TRONG Alpine image
          sudo chroot /tmp/r /bin/sh -c "
            set -e
            apk update
            apk upgrade --no-cache
            apk add --no-cache openjdk21-jre-headless openssh openrc bash curl wget ca-certificates tzdata screen fastfetch
          "

          # SSH config
          sudo chroot /tmp/r /bin/sh -c "
            sed -i 's/#PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config
            sed -i 's/#PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
            ssh-keygen -A
            echo 'root:toor' | chpasswd
          "

          # Enable services
          sudo chroot /tmp/r /bin/sh -c "
            rc-update add sshd default
            rc-update add networking boot
            rc-update add hostname boot
          "

          # Minecraft
          sudo mkdir -p /tmp/r/opt/minecraft
          [ -f server.jar ] && sudo cp server.jar /tmp/r/opt/minecraft/ && echo ">>> server.jar copied" || echo "WARN: no server.jar"

          printf 'server-ip=0.0.0.0\nserver-port=25565\nquery.port=25565\nmax-tick-time=60000\nplayer-idle-timeout=10\nview-distance=10\nsimulation-distance=5\naccepts-transfers=true\n' \
            | sudo tee /tmp/r/opt/minecraft/server.properties > /dev/null

          printf 'eula=true\n' | sudo tee /tmp/r/opt/minecraft/eula.txt > /dev/null

          printf '#!/bin/bash\ncd /opt/minecraft\nexec java -Xms512M -Xmx1800M -XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:MaxGCPauseMillis=200 -XX:+UnlockExperimentalVMOptions -XX:+DisableExplicitGC -jar server.jar nogui\n' \
            | sudo tee /tmp/r/opt/minecraft/start.sh > /dev/null
          sudo chmod +x /tmp/r/opt/minecraft/start.sh

          # OpenRC service
          printf '#!/sbin/openrc-run\nname="minecraft"\ndescription="Minecraft Java Server"\ncommand="/opt/minecraft/start.sh"\ncommand_background=true\npidfile="/run/minecraft.pid"\noutput_log="/var/log/minecraft.log"\nerror_log="/var/log/minecraft.log"\ndepend() { after networking sshd; }\n' \
            | sudo tee /tmp/r/etc/init.d/minecraft > /dev/null
          sudo chmod +x /tmp/r/etc/init.d/minecraft

          sudo chroot /tmp/r /bin/sh -c "rc-update add minecraft default"

          echo "=== Disk usage ==="
          df -h /tmp/r

      - name: Unmount
        run: sudo umount /tmp/r

      - name: Nen base.img thanh base.zip
        run: |
          zip -9 base.zip base.img
          du -sh base.img base.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: alpine-uml-disk-${{ steps.cfg.outputs.DISK_GB }}gb
          path: base.zip
          retention-days: 30

      - name: Huong dan
        run: |
          echo "==========================================="
          echo "SAU KHI DOWNLOAD artifact:"
          echo "1. Upload base.zip -> /home/container/"
          echo "2. run.sh tu dong giai nen + boot UML"
          echo ""
          echo "slirp.yaml:"
          echo "  - 28102:22     # SSH"
          echo "  - 28103:25565  # Minecraft Java"
          echo ""
          echo "ssh root@<ip> -p 28102  (pass: toor)"
          echo "Minecraft: <ip>:28103"
          echo "==========================================="
